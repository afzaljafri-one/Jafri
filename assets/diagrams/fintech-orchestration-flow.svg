<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%" role="img" aria-label="Fintech Payment Orchestration and Multi-PSP Cascading Architecture">
  <defs>
    <linearGradient id="fintechBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1019"/>
      <stop offset="100%" stop-color="#06090e"/>
    </linearGradient>
    <linearGradient id="pspGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c2c"/>
      <stop offset="100%" stop-color="#0d131f"/>
    </linearGradient>
    <linearGradient id="routerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#231b11"/>
      <stop offset="100%" stop-color="#141009"/>
    </linearGradient>
    <filter id="pShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Canvas -->
  <rect width="960" height="420" fill="url(#fintechBg)" rx="12"/>
  <rect x="1" y="1" width="958" height="418" fill="none" stroke="rgba(199,166,106,0.22)" stroke-width="1" rx="11"/>

  <!-- Title -->
  <text x="480" y="34" text-anchor="middle" fill="#c7a66a" font-family="Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="3">FINTECH &amp; PAYMENTS · ORCHESTRATION ARCHITECTURE</text>
  <text x="480" y="62" text-anchor="middle" fill="#f4f1eb" font-family="Georgia, serif" font-size="20" font-weight="400">Multi-PSP Routing, Cascading &amp; Tokenisation Engine (~85% Success Rate)</text>

  <!-- Step 1: Merchant / Booking Checkout (Left) -->
  <g transform="translate(36, 100)" filter="url(#pShadow)">
    <rect width="190" height="260" rx="8" fill="url(#pspGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <rect x="0" y="0" width="190" height="34" rx="8" fill="#1b2333"/>
    <text x="14" y="22" fill="#89a2c4" font-family="Inter, sans-serif" font-size="10" font-weight="700">01 / CHECKOUT INITIATION</text>
    <g transform="translate(14, 50)">
      <text x="0" y="12" fill="#f4f1eb" font-family="Inter, sans-serif" font-size="13" font-weight="600">Unified Checkout</text>
      <text x="0" y="32" fill="#8b949e" font-family="Inter, sans-serif" font-size="11">
        <tspan x="0" dy="0">• Domestic &amp; Global cards</tspan>
        <tspan x="0" dy="18">• Multi-currency pricing</tspan>
        <tspan x="0" dy="18">• Saved card tokenisation</tspan>
        <tspan x="0" dy="18">• UPI / NetBanking / BNPL</tspan>
        <tspan x="0" dy="18">• Gift cards &amp; wallets</tspan>
      </text>

      <rect x="0" y="130" width="162" height="34" rx="4" fill="#0f141f"/>
      <text x="81" y="151" text-anchor="middle" fill="#89a2c4" font-family="Inter, sans-serif" font-size="10">Multi-Rail Acceptance</text>
    </g>
  </g>

  <!-- Connect 1 to 2 -->
  <g transform="translate(230, 225)">
    <line x1="0" y1="0" x2="28" y2="0" stroke="#c7a66a" stroke-width="1.5"/>
    <polygon points="28,-4 34,0 28,4" fill="#c7a66a"/>
  </g>

  <!-- Step 2: Intelligent Routing & Risk Engine (Center) -->
  <g transform="translate(268, 90)" filter="url(#pShadow)">
    <rect width="250" height="280" rx="10" fill="url(#routerGrad)" stroke="rgba(199,166,106,0.6)" stroke-width="1.5"/>
    <rect x="0" y="0" width="250" height="36" rx="10" fill="#241e12"/>
    <text x="125" y="23" text-anchor="middle" fill="#e0c28b" font-family="Inter, sans-serif" font-size="10.5" font-weight="700">02 / SMART ROUTING &amp; CASCADING</text>
    <g transform="translate(16, 52)">
      <text x="0" y="12" fill="#f4f1eb" font-family="Georgia, serif" font-size="15">Intelligent Decisioning</text>
      <text x="0" y="32" fill="#d2c5af" font-family="Inter, sans-serif" font-size="11">
        <tspan x="0" dy="0">• Real-time health check per gateway</tspan>
        <tspan x="0" dy="18">• BIN &amp; card issuing bank routing</tspan>
        <tspan x="0" dy="18">• Automated secondary cascading</tspan>
        <tspan x="0" dy="18">• Fraud scoring &amp; 3DS verification</tspan>
        <tspan x="0" dy="18">• Chargeback &amp; risk governance</tspan>
      </text>

      <rect x="0" y="142" width="218" height="42" rx="4" fill="#1b160e" stroke="rgba(199,166,106,0.3)"/>
      <text x="109" y="159" text-anchor="middle" fill="#e0c28b" font-family="Inter, sans-serif" font-size="10.5" font-weight="700">PERFORMANCE GOAL</text>
      <text x="109" y="174" text-anchor="middle" fill="#f4f1eb" font-family="Inter, sans-serif" font-size="11">~85% Success Rate</text>
    </g>
  </g>

  <!-- Connect 2 to 3 -->
  <g transform="translate(522, 225)">
    <line x1="0" y1="0" x2="28" y2="0" stroke="#c7a66a" stroke-width="1.5"/>
    <polygon points="28,-4 34,0 28,4" fill="#c7a66a"/>
  </g>

  <!-- Step 3: Global PSP & Bank Acquiring Rails (Right Top) -->
  <g transform="translate(554, 90)" filter="url(#pShadow)">
    <rect width="370" height="135" rx="8" fill="url(#pspGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <rect x="0" y="0" width="370" height="30" rx="8" fill="#1b2333"/>
    <text x="14" y="20" fill="#89a2c4" font-family="Inter, sans-serif" font-size="10" font-weight="700">03A / GLOBAL &amp; REGIONAL ACQUIRING RAILS</text>
    <g transform="translate(14, 44)">
      <text x="0" y="11" fill="#f4f1eb" font-family="Inter, sans-serif" font-size="12" font-weight="600">Adyen · Stripe · PaySafe · Domestic Payment Aggregators</text>
      <text x="0" y="29" fill="#8b949e" font-family="Inter, sans-serif" font-size="10.5">
        <tspan x="0" dy="0">• Primary routing by geography and interchange economics</tspan>
        <tspan x="0" dy="16">• Instant failover cascade preventing basket drop-off</tspan>
      </text>
    </g>
  </g>

  <!-- Step 4: Closed-Loop BNPL & Working Capital (Right Bottom) -->
  <g transform="translate(554, 235)" filter="url(#pShadow)">
    <rect width="370" height="135" rx="8" fill="url(#pspGrad)" stroke="rgba(199,166,106,0.3)" stroke-width="1"/>
    <rect x="0" y="0" width="370" height="30" rx="8" fill="#1f1a12"/>
    <text x="14" y="20" fill="#e0c28b" font-family="Inter, sans-serif" font-size="10" font-weight="700">03B / CLOSED-LOOP AGENT FINANCE MODEL</text>
    <g transform="translate(14, 44)">
      <text x="0" y="11" fill="#f4f1eb" font-family="Inter, sans-serif" font-size="12" font-weight="600">Closed-Loop Travel Agent Financing Model</text>
      <text x="0" y="29" fill="#8b949e" font-family="Inter, sans-serif" font-size="10.5">
        <tspan x="0" dy="0">• Proprietary ticketing collateralization &amp; automated daily deduction</tspan>
        <tspan x="0" dy="16">• Working-capital disbursals with robust credit risk governance</tspan>
      </text>
    </g>
  </g>
</svg>
