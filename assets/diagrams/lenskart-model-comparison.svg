<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" role="img" aria-label="Lenskart Home Try-On Operating Model Evolution: Salaried Model vs Entrepreneur-Led Model">
  <defs>
    <linearGradient id="lenskartCard1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b26"/>
      <stop offset="100%" stop-color="#0e1118"/>
    </linearGradient>
    <linearGradient id="lenskartCard2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b14"/>
      <stop offset="100%" stop-color="#12100b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c7a66a"/>
      <stop offset="100%" stop-color="#e0c28b"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" fill="#090c12" rx="12"/>
  <rect x="1" y="1" width="958" height="478" fill="none" stroke="rgba(199,166,106,0.2)" stroke-width="1" rx="11"/>

  <!-- Title & Kicker -->
  <text x="480" y="38" text-anchor="middle" fill="#c7a66a" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="3">LENSKART HOME TRY-ON · OPERATING MODEL EVOLUTION</text>
  <text x="480" y="66" text-anchor="middle" fill="#f4f1eb" font-family="Georgia, serif" font-size="20" font-weight="400">From Centrally Managed Salaried Field Operation to Scalable Entrepreneur-Led Ecosystem</text>

  <!-- STAGE 1 CARD (Left) -->
  <g transform="translate(36, 92)" filter="url(#shadow)">
    <rect width="424" height="348" rx="10" fill="url(#lenskartCard1)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    
    <!-- Stage Header -->
    <rect x="0" y="0" width="424" height="44" rx="10" fill="#1b2130"/>
    <text x="20" y="27" fill="#89a2c4" font-family="Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">STAGE 1 · GROUND-UP FOUNDATION</text>
    <rect x="310" y="12" width="96" height="20" rx="4" fill="rgba(255,255,255,0.08)"/>
    <text x="358" y="26" text-anchor="middle" fill="#d0d7de" font-family="Inter, sans-serif" font-size="10" font-weight="600">SALARIED MODEL</text>

    <!-- Content Items -->
    <!-- Item 1 -->
    <g transform="translate(20, 64)">
      <circle cx="12" cy="12" r="12" fill="rgba(137,162,196,0.15)"/>
      <text x="12" y="16" text-anchor="middle" fill="#89a2c4" font-family="Inter, sans-serif" font-size="11" font-weight="700">1</text>
      <text x="36" y="11" fill="#f4f1eb" font-family="Inter, sans-serif" font-size="13" font-weight="600">Two-Person Operating Unit</text>
      <text x="36" y="27" fill="#8b949e" font-family="Inter, sans-serif" font-size="11">1 Salaried Optometrist + 1 Sales Representative per kit</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(20, 118)">
      <circle cx="12" cy="12" r="12" fill="rgba(137,162,196,0.15)"/>
      <text x="12" y="16" text-anchor="middle" fill="#89a2c4" font-family="Inter, sans-serif" font-size="11" font-weight="700">2</text>
      <text x="36" y="11" fill="#f4f1eb" font-family="Inter, sans-serif" font-size="13" font-weight="600">Centralized Cost &amp; Fleet Logistics</text>
      <text x="36" y="27" fill="#8b949e" font-family="Inter, sans-serif" font-size="11">Company-provided transit, fixed monthly salaries, company kit maintenance</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(20, 172)">
      <circle cx="12" cy="12" r="12" fill="rgba(137,162,196,0.15)"/>
      <text x="12" y="16" text-anchor="middle" fill="#89a2c4" font-family="Inter, sans-serif" font-size="11" font-weight="700">3</text>
      <text x="36" y="11" fill="#f4f1eb" font-family="Inter, sans-serif" font-size="13" font-weight="600">Scale Milestones Reached</text>
      <text x="36" y="27" fill="#8b949e" font-family="Inter, sans-serif" font-size="11">Expanded to 200 kits across 7 cities · ~400 field personnel</text>
    </g>

    <!-- Item 4 -->
    <g transform="translate(20, 226)">
      <circle cx="12" cy="12" r="12" fill="rgba(137,162,196,0.15)"/>
      <text x="12" y="16" text-anchor="middle" fill="#89a2c4" font-family="Inter, sans-serif" font-size="11" font-weight="700">4</text>
      <text x="36" y="11" fill="#f4f1eb" font-family="Inter, sans-serif" font-size="13" font-weight="600">Stabilisation &amp; Quality Control</text>
      <text x="36" y="27" fill="#8b949e" font-family="Inter, sans-serif" font-size="11">Standardised optometrist test protocols and brought return % under control</text>
    </g>

    <!-- Status pill -->
    <rect x="20" y="292" width="384" height="38" rx="6" fill="#131720" stroke="rgba(255,255,255,0.06)"/>
    <text x="212" y="315" text-anchor="middle" fill="#89a2c4" font-family="Inter, sans-serif" font-size="11" font-weight="500">Outcome: High operational fidelity · Salary-heavy overhead</text>
  </g>

  <!-- PIVOT CONNECTOR -->
  <g transform="translate(460, 245)">
    <circle cx="20" cy="20" r="18" fill="#1b1710" stroke="#c7a66a" stroke-width="1.5"/>
    <path d="M14 20 L24 20 M20 15 L25 20 L20 25" stroke="#e0c28b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="20" y="48" text-anchor="middle" fill="#c7a66a" font-family="Inter, sans-serif" font-size="9" font-weight="700" letter-spacing="1">OPERATING PIVOT</text>
  </g>

  <!-- STAGE 2 CARD (Right) -->
  <g transform="translate(500, 92)" filter="url(#shadow)">
    <rect width="424" height="348" rx="10" fill="url(#lenskartCard2)" stroke="rgba(199,166,106,0.4)" stroke-width="1.5"/>
    
    <!-- Stage Header -->
    <rect x="0" y="0" width="424" height="44" rx="10" fill="#241e13"/>
    <text x="20" y="27" fill="#e0c28b" font-family="Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">STAGE 2 · ECONOMIC TRANSFORMATION</text>
    <rect x="286" y="12" width="120" height="20" rx="4" fill="rgba(199,166,106,0.2)"/>
    <text x="346" y="26" text-anchor="middle" fill="#e0c28b" font-family="Inter, sans-serif" font-size="10" font-weight="700">ENTREPRENEUR MODEL</text>

    <!-- Content Items -->
    <!-- Item 1 -->
    <g transform="translate(20, 64)">
      <circle cx="12" cy="12" r="12" fill="rgba(199,166,106,0.2)"/>
      <text x="12" y="16" text-anchor="middle" fill="#e0c28b" font-family="Inter, sans-serif" font-size="11" font-weight="700">1</text>
      <text x="36" y="11" fill="#f4f1eb" font-family="Inter, sans-serif" font-size="13" font-weight="600">Single Entrepreneur Role</text>
      <text x="36" y="27" fill="#d2c5af" font-family="Inter, sans-serif" font-size="11">Combined eye testing &amp; sales closing into one skilled optometrist</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(20, 118)">
      <circle cx="12" cy="12" r="12" fill="rgba(199,166,106,0.2)"/>
      <text x="12" y="16" text-anchor="middle" fill="#e0c28b" font-family="Inter, sans-serif" font-size="11" font-weight="700">2</text>
      <text x="36" y="11" fill="#f4f1eb" font-family="Inter, sans-serif" font-size="13" font-weight="600">Asset-Light Vehicle Model</text>
      <text x="36" y="27" fill="#d2c5af" font-family="Inter, sans-serif" font-size="11">Shifted vehicle ownership and maintenance responsibility to optometrists</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(20, 172)">
      <circle cx="12" cy="12" r="12" fill="rgba(199,166,106,0.2)"/>
      <text x="12" y="16" text-anchor="middle" fill="#e0c28b" font-family="Inter, sans-serif" font-size="11" font-weight="700">3</text>
      <text x="36" y="11" fill="#f4f1eb" font-family="Inter, sans-serif" font-size="13" font-weight="600">Performance-Linked Economics</text>
      <text x="36" y="27" fill="#d2c5af" font-family="Inter, sans-serif" font-size="11">Lower fixed monthly base + uncapped sales commission upside</text>
    </g>

    <!-- Item 4 -->
    <g transform="translate(20, 226)">
      <circle cx="12" cy="12" r="12" fill="rgba(199,166,106,0.2)"/>
      <text x="12" y="16" text-anchor="middle" fill="#e0c28b" font-family="Inter, sans-serif" font-size="11" font-weight="700">4</text>
      <text x="36" y="11" fill="#f4f1eb" font-family="Inter, sans-serif" font-size="13" font-weight="600">Scalable Volume Breakthrough</text>
      <text x="36" y="27" fill="#d2c5af" font-family="Inter, sans-serif" font-size="11">Unlocked scale to exceed 500+ daily Home Try-On appointments</text>
    </g>

    <!-- Status pill -->
    <rect x="20" y="292" width="384" height="38" rx="6" fill="#1b1710" stroke="rgba(199,166,106,0.35)"/>
    <text x="212" y="315" text-anchor="middle" fill="#e0c28b" font-family="Inter, sans-serif" font-size="11" font-weight="600">Outcome: Asset-light · Higher optometrist earnings · Sustainable unit economics</text>
  </g>
</svg>
