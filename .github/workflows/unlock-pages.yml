name: Unlock GitHub Pages Environment

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/unlock-pages.yml'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  deployments: write
  contents: write

jobs:
  unlock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cancel stuck pages deployment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 -c "
          import os, json, urllib.request, urllib.error

          token = os.environ['GITHUB_TOKEN']
          repo = os.environ['REPOSITORY']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'Unlock-Pages/1.0'
          }

          log = []
          def log_print(msg):
              print(msg)
              log.append(str(msg))

          candidates = [
              '7773e7e1547e508d4447226fe7976b116356a6be',
              '7583149836',
              'latest'
          ]

          # Try cancel on candidates
          for cand in candidates:
              cancel_url = f'https://api.github.com/repos/{repo}/pages/deployments/{cand}/cancel'
              req = urllib.request.Request(cancel_url, headers=headers, method='POST', data=b'')
              try:
                  with urllib.request.urlopen(req) as resp:
                      log_print(f'Cancel {cand}: HTTP {resp.status}')
              except urllib.error.HTTPError as he:
                  body = he.read().decode('utf-8', errors='replace')
                  log_print(f'Cancel {cand} HTTPError: {he.code} - {body}')
              except Exception as e:
                  log_print(f'Cancel {cand} Exception: {e}')

          # Query pages info
          try:
              pages_url = f'https://api.github.com/repos/{repo}/pages'
              req = urllib.request.Request(pages_url, headers=headers)
              with urllib.request.urlopen(req) as resp:
                  info = json.loads(resp.read().decode('utf-8'))
                  log_print(f'Pages info: status={info.get(\"status\")}, build_type={info.get(\"build_type\")}')
          except Exception as e:
              log_print(f'Pages info query failed: {e}')

          # Query pages builds in detail
          try:
              builds_url = f'https://api.github.com/repos/{repo}/pages/builds'
              req = urllib.request.Request(builds_url, headers=headers)
              with urllib.request.urlopen(req) as resp:
                  builds = json.loads(resp.read().decode('utf-8'))
                  log_print(f'Total builds: {len(builds)}')
                  for b in builds:
                      c_sha = (b.get('commit') or '')[:7]
                      b_status = b.get('status')
                      b_url = b.get('url')
                      if '7773e7e' in (b.get('commit') or '') or b_status not in ['built', 'errored']:
                          log_print(f'Special Build: id={b.get(\"id\")} status={b_status} commit={c_sha} error={b.get(\"error\", {})}')
                      else:
                          log_print(f'Build id={b.get(\"id\")} status={b_status} commit={c_sha}')
          except Exception as e:
              log_print(f'Pages builds query failed: {e}')

          # Query pages deployments
          try:
              pages_dep_url = f'https://api.github.com/repos/{repo}/pages/deployments'
              req = urllib.request.Request(pages_dep_url, headers=headers)
              with urllib.request.urlopen(req) as resp:
                  p_deps = json.loads(resp.read().decode('utf-8'))
                  log_print(f'Pages deployments: {p_deps}')
          except Exception as e:
              log_print(f'Pages deployments list query: {e}')

          with open('debug_deploy.txt', 'w') as f:
              f.write('\n'.join(log))
          "

      - name: Commit and push debug output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add debug_deploy.txt
          git commit -m "chore(debug): record cancel pages deployment attempt" || echo "No changes"
          git push origin main || echo "Push failed"

      - name: Commit and push debug output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add debug_deploy.txt
          git commit -m "chore(debug): record deployment status details" || echo "No changes"
          git push origin main || echo "Push failed"
