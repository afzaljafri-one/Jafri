name: Unlock GitHub Pages Environment

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/unlock-pages.yml'
  workflow_dispatch:

permissions:
  deployments: write

jobs:
  unlock:
    runs-on: ubuntu-latest
    steps:
      - name: Clear in-progress deployments
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 -c "
          import os, json, urllib.request

          token = os.environ['GITHUB_TOKEN']
          repo = os.environ['REPOSITORY']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'Unlock-Pages/1.0'
          }

          url = f'https://api.github.com/repos/{repo}/deployments?environment=github-pages'
          req = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(req) as resp:
              deployments = json.loads(resp.read().decode('utf-8'))

          print(f'Found {len(deployments)} deployments for github-pages.')
          for d in deployments:
              dep_id = d['id']
              sha = d.get('sha', '')[:7]
              stat_url = f'https://api.github.com/repos/{repo}/deployments/{dep_id}/statuses'
              stat_req = urllib.request.Request(stat_url, headers=headers)
              with urllib.request.urlopen(stat_req) as s_resp:
                  statuses = json.loads(s_resp.read().decode('utf-8'))

              latest_state = statuses[0]['state'] if statuses else 'unknown'
              print(f'Deployment {dep_id} ({sha}): latest state = {latest_state}')
              if latest_state in ['in_progress', 'queued', 'waiting']:
                  print(f'Marking stuck deployment {dep_id} as failure...')
                  post_req = urllib.request.Request(
                      stat_url,
                      data=json.dumps({'state': 'failure', 'description': 'Cancelled hung deployment to unlock environment'}).encode('utf-8'),
                      headers={**headers, 'Content-Type': 'application/json'}
                  )
                  try:
                      with urllib.request.urlopen(post_req) as p_resp:
                          print(f'Successfully marked {dep_id} as failure (HTTP {p_resp.status})')
                  except Exception as e:
                      print(f'Failed to update {dep_id}: {e}')
          "
